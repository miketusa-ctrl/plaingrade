# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

account_id = "<CLOUDFLARE_ACCOUNT_ID>"
name = "plaingrade-api-staging"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false

[limits]
cpu_ms = 100

[observability]
enabled = false

[vars]
PRO_DAILY_QUOTA = "5000"
PRO_GLOBAL_DAILY_CAP = "5000"
PRO_CHECKOUT_URL = "https://buy.polar.sh/polar_cl_kHymclijdlzo9hMuxqsz1tnN6B9ye3R7AbjqX09aKko"
MCP_REGISTRY_AUTH = ""
ENVIRONMENT = "staging"
PUBLIC_LAUNCH = "false"
BRAND_NAME = "PlainGrade"
PUBLIC_ORIGIN = "https://plaingrade-api.mike-tusa.workers.dev"
SUPPORT_EMAIL = "digitalpromohub.support@gmail.com"
ANON_PER_MIN = "10"
ANON_DAILY_PER_IP = "50"
KEY_PER_MIN = "30"
KEY_DAILY_QUOTA = "100"
KEY_ISSUER_DAILY_QUOTA = "300"
KEY_ISSUE_PER_IP_PER_DAY = "3"
KEY_ISSUE_GLOBAL_PER_DAY = "50"
GLOBAL_DAILY_REQUEST_CAP = "3000"

[[kv_namespaces]]
binding = "PLAINGRADE_KV"
id = "<KV_NAMESPACE_ID>"

[[kv_namespaces]]
binding = "LICENSES"
id = "<KV_NAMESPACE_ID>"
preview_id = "<KV_PREVIEW_NAMESPACE_ID>"

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "KEY_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RAPIDAPI_BASIC_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RAPIDAPI_PRO_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"
  [ratelimits.simple]
  limit = 120
  period = 60

